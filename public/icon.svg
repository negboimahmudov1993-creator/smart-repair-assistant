<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container with squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Glowing circle behind tools -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.16"/>

  <!-- Crossed Wrench and Screwdriver / Hammer Icon -->
  <g filter="url(#shadow)">
    <!-- Wrench -->
    <path d="M190 140 C165 140 145 155 135 175 C125 195 130 220 145 235 L295 385 C305 395 320 395 330 385 L355 360 C365 350 365 335 355 325 L205 175 C215 160 215 140 190 140 Z" fill="url(#accentGrad)"/>
    <!-- Adjustable head opening -->
    <circle cx="175" cy="180" r="22" fill="#0f172a"/>
    <rect x="155" y="150" width="30" height="25" rx="4" fill="#0f172a" transform="rotate(-35 175 165)"/>

    <!-- Screwdriver / Tool crossing -->
    <path d="M340 145 L375 180 L230 375 C222 385 208 385 200 375 L180 355 C172 347 172 333 180 325 Z" fill="#94a3b8" opacity="0.85"/>
    <path d="M335 140 L380 185 L395 170 L350 125 Z" fill="url(#glowGrad)"/>
  </g>

  <!-- AI Sparkles -->
  <g fill="#fbbf24">
    <path d="M375 220 L385 245 L410 255 L385 265 L375 290 L365 265 L340 255 L365 245 Z" />
    <circle cx="340" cy="190" r="8" fill="#f97316"/>
    <circle cx="410" cy="310" r="6" fill="#facc15"/>
  </g>
</svg>
